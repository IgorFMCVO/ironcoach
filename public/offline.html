<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRON Coach - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #FF3B30, #FF6347);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    h1 span {
      color: #FF3B30;
    }
    
    p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      margin-bottom: 32px;
      max-width: 300px;
    }
    
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    
    .icon svg {
      width: 32px;
      height: 32px;
      color: rgba(255,255,255,0.3);
    }
    
    button {
      background: linear-gradient(135deg, #FF3B30, #FF5C4D);
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }
    
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="logo">I</div>
  <h1>IRON<span>COACH</span></h1>
  
  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
    </svg>
  </div>
  
  <p>Você está offline. Verifique sua conexão com a internet e tente novamente.</p>
  
  <button onclick="window.location.reload()">
    Tentar novamente
  </button>
  
  <script>
    // Verificar conexão periodicamente
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
